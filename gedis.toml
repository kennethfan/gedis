# Gedis 最小配置示例。完整说明见票 #5。
[server]
host = "127.0.0.1"
port = 6380

[storage]
datadir = "./data"

[memory]
maxmemory = 1073741824
policy = "allkeys-lru"

[persistence]
appendonly = true
fsync = "everysec"

[metrics]
enabled = false
port = 9121

[lua]
# 单脚本执行上限（毫秒），对标 Redis lua-time-limit；缺席默认 5000，显式 0 表示不限。
time_limit = 5000
